<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      height: 5000px;
    }
    #up {
      display: none;
      background-color: red;
      border: none;
      color: white;
      font-weight: bold;
      padding: 6px;
      border-radius: 4px;
      position: fixed;
      bottom: 20px;
      right: 20px;
      cursor: pointer;
    }
    ul {
      padding: 0;
      margin: 0;
      background-color: #ddd;
      margin: 20px auto;
      padding: 20px;
      width: 400px;
      list-style: none;
      display: flex;
      justify-content: space-between;
    }
    ul li {
      width: 60px;
      height: 60px;
      border: 2px solid transparent;
      opacity: 0.4;
      cursor: pointer;
      transition: 0.3s;
    }
    ul li.active,
    ul li:hover {
      opacity: 1;
    }
    ul li:first-child {
      background-color: red;
    }
    ul li:nth-child(2) {
      background-color: green;
    }
    ul li:nth-child(3) {
      background-color: blue;
    }
    ul li:nth-child(4) {
      background-color: black;
    }
    .experiment {
      background-color: red;
      width: 600px;
      height: 300px;
      margin: 20px auto;
    }
  </style>
</head>
<body>
  <button id="btn">Stop</button>
  <div id="counter">5</div>
  <button id="up">Up</button>
  <ul>
    <li class="active" data-color="red"></li>
    <li data-color="green"></li>
    <li data-color="blue"></li>
    <li data-color="black"></li>
  </ul>
  <div class="experiment"></div>
  <form action="">
    <input type="text" class="name" />
  </form>
  <script src="11.BrowserObjectModel.js"></script>
</body>
</html>
