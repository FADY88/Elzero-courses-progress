<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Lists</title>
    <meta name="description" content="How to create lists" />
    <link rel="stylesheet" href="">
  </head>
  <body>
    <h1>Lists</h1>
    <p>This Is My <b>Lists</b>, Welcome</p>
    <!--
      ul => Unordered List
      li => List Item
      ol => Ordered List
    -->
    <ul>
      <li>HTML</li>
      <li>CSS</li>
      <li>
        JS
        <ul>
          <li>Angular</li>
          <li>Reactjs</li>
          <li>Vuejs</li>
        </ul>
      </li>
    </ul>
    <!-- Separator -->
    <!--
      reversed => Reverse The Ordering
      start => Start From Position
      type => Type Of Ordering
    -->
    <ol>
      <li value="50">Name</li>
      <li>Address</li>
      <li>Id</li>
    </ol>
    <!-- Separator -->
    <!--
      dl => Description List
      dt => Term
      dd => Description Term
    -->
    <dl>
      <dt>HTML</dt>
      <dd>Language Of The Web</dd>
      <dd>The First Lan</dd>
      <dt>CSS</dt>
      <dd>Language Of The Visuals</dd>
    </dl>
  </body>
</html>
